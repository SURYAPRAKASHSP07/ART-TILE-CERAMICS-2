<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sanitary Items | Art Tile Ceramics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="premium-floor-tiles.css" />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #cac5c5;
        overflow-x: hidden;
      }

      /* HEADER */
      .page-header {
        text-align: center;
        padding: 40px 20px;
        background: #111;
        color: white;
      }

      .back-btn {
        display: inline-block;
        text-decoration: none;
        color: #7b2cbf;
        font-weight: 600;
        background-color: white;
        padding: 10px 20px;
        border-radius: 30px;
      }

      /* CATEGORY BUTTONS */
      .btn-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 15px;
        position: sticky;
        top: 0;
        background: #cac5c5;
        z-index: 1000;
      }

      .btn-container button {
        padding: 8px 15px;
        border-radius: 20px;
        border: 2px solid #b984db;
        background: white;
        color: #7b2cbf;
        font-weight: bold;
        cursor: pointer;
      }

      /* SECTION */
      .tile-section {
        margin-top: 30px;
        justify-content: center;
      }

      .tile-section h2 {
        padding-left: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #7b2cbf;
        color: white;
        font-weight: 900;
        padding: 10px;
      }

      /* GRID */
      .tile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 15px;
        padding: 10px;
      }

      /* CARD */
      .tile-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .tile-card:hover {
        transform: translateY(-5px);
      }

      .img-container {
        width: 100%;
        height: 240px;
      }

      .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* TILE INFO */
      .tile-info {
        text-align: center;
        padding: 10px;
      }

      .tile-info h3 {
        margin: 0;
        font-size: 16px;
      }

      .tile-info p {
        margin: 4px 0;
        font-size: 13px;
        color: #555;
      }

      /* BACK TO TOP */
      #backToTop {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 50px;
        height: 50px;
      }

      #backToTop img {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #cac5c5;
      }

      .back-btn {
        display: inline-block;
        text-decoration: none;
        color: #7b2cbf;
        font-weight: 600;
        background-color: white;
        padding: 10px 20px;
        border-radius: 30px;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: #7b2cbf;
        color: white;
      }

      /* GALLERY */
      .tile-gallery {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        padding: 40px;
        max-width: 1600px;
        margin: auto;
      }

      /* Large screens (Desktop) */
      @media (min-width: 1200px) {
        .tile-gallery {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      /* Laptop */
      @media (min-width: 992px) and (max-width: 1199px) {
        .tile-gallery {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Tablet */
      @media (min-width: 768px) and (max-width: 991px) {
        .tile-gallery {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Mobile */
      @media (max-width: 767px) {
        .tile-gallery {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .tile-card {
        width: 100%;
        max-height: 800px;
        background: rgb(255, 255, 255);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
      }

      .tile-card:hover {
        transform: translateY(-5px);
        transition: 0.3s ease-in-out;
      }
      .tile-card .img-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .tile-card .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 4x2 tiles */
      .tile-4x2 img {
        width: 100%;
        aspect-ratio: 1 / 2;
        object-fit: cover;
      }

      /* 2x2 tiles */
      .tile-2x2 img {
        width: 100%;
        object-fit: cover;
        aspect-ratio: 1/1;
      }

      .tile-info {
        padding: 12px;
        flex-grow: 1; /* makes all cards equal height */
      }

      .tile-info h3 {
        margin: 0;
        font-size: 18px;
      }

      .tile-info p {
        margin: 5px 0;
        font-size: 14px;
        color: #555;
      }

      /* BACK TO TOP BUTTON */

      #backToTop {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #ff7b00, #ff3c00);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transform: translateY(20px);
        transition: all 0.4s ease;
        z-index: 999;
      }

      /* Image inside */
      #backToTop img {
        width: 130%;
        height: 130%;
        object-fit: fill;
        border-radius: 50px;
      }

      /* Show Button */
      #backToTop.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* Mobile Adjust */
      @media (max-width: 768px) {
        #backToTop {
          right: 20px;
          bottom: 20px;
          width: 50px;
          height: 50px;
        }
      }
    </style>
  </head>

  <body>
    <header class="page-header">
      <h1>Sanitary Items</h1>
      <p>Elegant • Durable • Modern Designs</p>

      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </header>

    <!-- CATEGORY BUTTONS -->
    <div id="categoryButtons" class="btn-container"></div>

    <!-- SECTIONS -->
    <div id="sectionsContainer"></div>

    <a href="#" id="backToTop">
      <img src="Screenshot_2026-02-26_214133.png" />
    </a>

    <script>
      async function loadTiles() {
        const response = await fetch("Sanitary items.json");
        const tiles = await response.json();

        const btnContainer = document.getElementById("categoryButtons");
        const sectionsContainer = document.getElementById("sectionsContainer");

        // ✅ Get unique finishes
        const finishes = [...new Set(tiles.map((tile) => tile.finish))];

        // ✅ Create buttons
        finishes.forEach((finish) => {
          const safeId = finish.replace(/\s+/g, "-");

          const btn = document.createElement("button");
          btn.innerText = finish;

          btn.onclick = () => {
            document.getElementById(safeId).scrollIntoView({
              behavior: "smooth",
            });
          };

          btnContainer.appendChild(btn);
        });

        // ✅ Create sections
        finishes.forEach((finish) => {
          const safeId = finish.replace(/\s+/g, "-");

          const section = document.createElement("div");
          section.className = "tile-section";
          section.id = safeId;

          section.innerHTML = `
      <h2>${finish}</h2>
      <div class="tile-gallery" id="${safeId}-grid"></div>
    `;

          sectionsContainer.appendChild(section);
        });

        // ✅ Add tiles to sections
        tiles.forEach((tile) => {
          const safeId = tile.finish.replace(/\s+/g, "-");

          const grid = document.getElementById(`${safeId}-grid`);

          const card = document.createElement("div");

          if (tile.size === "4x2") {
            card.className = "tile-card tile-4x2";
          } else {
            card.className = "tile-card tile-2x2";
          }

          card.innerHTML = `
      <div class="img-container">
        <img src="${tile.image}">
      </div>
      <div class="tile-info">
        <h3>${tile.name}</h3>
      </div>
    `;

          grid.appendChild(card);
        });
      }

      loadTiles();
    </script>
  </body>
</html>
