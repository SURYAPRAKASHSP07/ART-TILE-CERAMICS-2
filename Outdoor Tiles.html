<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parking Tiles | Art Tile Ceramics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #cac5c5;
      }

      /* HEADER */
      .page-header {
        text-align: center;
        padding: 40px 20px;
        background: #111;
        color: white;
      }

      .page-header h1 {
        margin: 0;
        font-size: 40px;
      }

      .page-header p {
        opacity: 0.8;
      }

      /* BUTTON */
      button {
        margin-top: 8px;
        width: 100%;
        background-color: #7b2cbf;
        font-weight: bold;
        color: white;
        padding: 6px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
      }

      .back-btn {
        display: inline-block;
        text-decoration: none;
        color: #7b2cbf;
        font-weight: 600;
        background-color: white;
        padding: 10px 20px;
        border-radius: 30px;
        transition: 0.3s;
      }
      .back-btn:hover {
        color: white;
        background-color: #7b2cbf;
        transition: 0.9sec ease-in;
      }

      .tile-2x2 img {
        display: none;
      }

      /* GALLERY */
      .tile-gallery {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        padding: 40px;
        max-width: 1800px;
        margin: auto;
      }

      /* Large screens (Desktop) */
      @media (min-width: 1200px) {
        .tile-gallery {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      /* Laptop */
      @media (min-width: 992px) and (max-width: 1199px) {
        .tile-gallery {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Tablet */
      @media (min-width: 768px) and (max-width: 991px) {
        .tile-gallery {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Mobile */
      @media (max-width: 767px) {
        .tile-gallery {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .tile-card {
        width: 100%;
        max-height: 800px;
        background: rgb(255, 255, 255);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
      }

      .tile-card:hover {
        transform: translateY(-5px);
        transition: 0.3s ease-in-out;
      }
      .tile-card .img-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .tile-card .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 2x2 tiles */
      .tile-2x2 img {
        width: 100%;
        object-fit: cover;
        aspect-ratio: 1/1;
      }

      .tile-info {
        padding: 12px;
        flex-grow: 1; /* makes all cards equal height */
      }

      .tile-info h3 {
        margin: 0;
        font-size: 18px;
      }

      .tile-info p {
        margin: 5px 0;
        font-size: 14px;
        color: #555;
      }
      /* BACK TO TOP BUTTON */

      #backToTop {
        position: fixed;
        bottom: 40px;
        left: 40px;
        width: 30px;
        height: 30px;
        padding: 12px;
        background: linear-gradient(135deg, #be6ef3, #7b41a1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transform: translateY(20px);
        transition: all 0.4s ease;
        z-index: 999;
      }

      /* Image inside */
      #backToTop img {
        width: 130%;
        height: 130%;
        object-fit: fill;
        border-radius: 50px;
      }

      /* Show Button */
      #backToTop.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* Mobile Adjust */
      @media (max-width: 768px) {
        #backToTop {
          padding: 10px;
          left: 20px;
          bottom: 35px;
          width: 30px;
          height: 30px;
        }
      }
    </style>
  </head>

  <body>
    <header class="page-header">
      <h1>Parking Tiles</h1>
      <p>Elegant • Durable • Modern Designs</p>

      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </header>

    <section class="tile-gallery" id="tileGallery"></section>

    <a href="#" id="backToTop">
      <img src="Screenshot_2026-02-26_214133.png" />
    </a>

    <script>
      async function loadTiles() {
        const response = await fetch("Outdoor Tiles.json");
        const tiles = await response.json();

        const gallery = document.getElementById("tileGallery");

        tiles.forEach((tile) => {
          const card = document.createElement("div");
          card.className = "tile-card";

          card.innerHTML = `
      <div class="img-container">
        <img src="${tile.image}" alt="${tile.name}">
      </div>
      <div class="tile-info">
        <h3>${tile.name}</h3>
        <p><b>Size:</b> ${tile.size}</p>
        <p><b>Finish:</b> ${tile.finish}</p>
        <p><b>Thickness:</b> ${tile.thickness}</p>
        <button onclick="openLink('${tile.url}')" ${!tile.url ? "disabled" : ""}>
          360° View
        </button>
      </div>
    `;

          gallery.appendChild(card);
        });
      }

      function openLink(url) {
        if (url) {
          window.open(url, "_blank");
        }
      }

      loadTiles();
    </script>
  </body>
</html>
