<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | Art Tile Ceramics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-box {
            background: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #7209b7;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn {
            background: #7209b7;
            color: white;
            width: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        #adminPanel {
            display: none;
            margin-top: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .upload-btn {
            background: #7209b7;
            color: white;
            width: 100%;
        }

        .logout-btn {
            margin-top: 15px;
            background: #e63946;
            color: white;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <h1>Admin Panel</h1>
        <p>Only admin can access</p>

        <button id="loginBtn" class="login-btn">
            Login with Google
        </button>

        <div id="adminPanel">

            <h3>Add Tile</h3>

            <input type="text" id="tileCode" placeholder="Tile Code">

            <input type="text" id="surface" placeholder="Surface">

            <input type="text" id="thickness" placeholder="Thickness">

            <input type="text" id="type" placeholder="Type">

            <input type="file" id="tileImage">

            <button class="upload-btn">
                Upload Tile
            </button>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>

    </div>

    <script type="module" src="firebase.js"></script>

</body>

</html>
