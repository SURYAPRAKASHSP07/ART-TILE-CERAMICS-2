<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Support Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f5fc;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #7209b7;
        }

        /* Vehicle Selection */
        .vehicle-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .vehicle-card {
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #faf7fd;
        }

        .vehicle-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .vehicle-card p {
            margin-top: 8px;
            font-size: 14px;
            color: #333;
        }

        .vehicle-card.active {
            border: 2px solid #7209b7;
            background: #f0e6fa;
        }

        /* Form */
        form {
            display: grid;
            gap: 15px;
        }

        input,
        textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            border-color: #7209b7;
            outline: none;
        }

        button {
            padding: 12px;
            border: none;
            background: #7209b7;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a0592;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .vehicle-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .vehicle-card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
            }
        }

        @media(max-width: 480px) {
            .vehicle-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .vehicle-card img {
                width: 100%;
                height: 100px;
                object-fit: cover;
                border-radius: 8px;
            }
        }

        .back-home-btn {
            display: inline-flex;
            margin-bottom: 20px;
            padding: 10px 18px;
            margin-left: 30px;
            background: #7209b7;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-home-btn:hover {
            background: #7209b7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Vehicle Support Form</h2>

        <form action="https://api.web3forms.com/submit" method="POST">

            <!-- Web3Forms Key -->
            <input type="hidden" name="access_key" value="d8e2f6ed-b055-409d-892a-9f0ce1debd6b">

            <!-- Selected Vehicle -->
            <input type="hidden" name="vehicle" id="selectedVehicle" required>

            <!-- Vehicle Options -->
            <div class="vehicle-options">
                <div class="vehicle-card" onclick="selectVehicle(this, 'Tata Ace')">
                    <img src="TATA_Ace.jpg" alt="Tata Ace">
                    <p>Tata Ace</p>
                </div>

                <div class="vehicle-card" onclick="selectVehicle(this, 'Abe mini auto')">
                    <img src="Abe mini auto.png" alt="Abe mini auto">
                    <p>Abe mini auto</p>
                </div>

                <div class="vehicle-card" onclick="selectVehicle(this, 'Pickup')">
                    <img src="Pick_Up.jpg" alt="Pickup">
                    <p>Pickup</p>
                </div>
            </div>

            <!-- Inputs -->
            <input type="text" name="name" placeholder="Customer Name" required>

            <input type="tel" name="phone" placeholder="Phone Number" required>

            <input type="text" name="order_number" placeholder="Order Number" required>

            <input type="text" name="start_location" placeholder="Start Location" required>

            <input type="text" name="delivery_point" placeholder="Delivery Point" required>

            <button type="submit">Submit Request</button>

        </form>
    </div>
    <a href="index.html" class="back-home-btn">← Back to Home</a>

    <script>
        function selectVehicle(element, vehicleName) {
            document.querySelectorAll('.vehicle-card').forEach(card => {
                card.classList.remove('active');
            });

            element.classList.add('active');
            document.getElementById('selectedVehicle').value = vehicleName;
        }
    </script>

</body>

</html>
