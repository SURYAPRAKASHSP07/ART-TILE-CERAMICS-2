<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Premium Floor Tiles | Art Tile Ceramics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #f4f4f4;
      }

      /* HEADER */

      .page-header {
        text-align: center;
        padding: 40px 20px;
        background: #111;
        color: white;
      }

      .page-header h1 {
        margin: 0;
        font-size: 40px;
      }

      .page-header p {
        opacity: 0.8;
      }

      .back-btn {
        display: inline-block;
        text-decoration: none;
        color: white;
        border: 1px solid orange;
        padding: 10px 20px;
        border-radius: 30px;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: orange;
        color: black;
      }

      /* GALLERY */
      .tile-gallery {
        display: grid;
        gap: 20px;
        padding: 40px;
        max-width: 1600px;
        margin: auto;
      }

      /* Large screens (Desktop) */
      @media (min-width: 1200px) {
        .tile-gallery {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      /* Laptop */
      @media (min-width: 992px) and (max-width: 1199px) {
        .tile-gallery {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Tablet */
      @media (min-width: 768px) and (max-width: 991px) {
        .tile-gallery {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Mobile */
      @media (max-width: 767px) {
        .tile-gallery {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .tile-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .tile-card:hover {
        transform: translateY(-5px);
      }

      .tile-card img {
        width: 100%;
        aspect-ratio: 1 / 2;
        object-fit: cover;
      }

      .tile-info {
        padding: 15px;
      }

      .tile-info h3 {
        margin: 0;
        font-size: 18px;
      }

      .tile-info p {
        margin: 5px 0;
        font-size: 14px;
        color: #555;
      }

      /* BACK TO TOP BUTTON */

      #backToTop {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #ff7b00, #ff3c00);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transform: translateY(20px);
        transition: all 0.4s ease;
        z-index: 999;
      }

      /* Image inside */
      #backToTop img {
        width: 130%;
        height: 130%;
        object-fit: fill;
        border-radius: 50px;
      }

      /* Show Button */
      #backToTop.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* Mobile Adjust */
      @media (max-width: 768px) {
        #backToTop {
          right: 20px;
          bottom: 20px;
          width: 50px;
          height: 50px;
        }
      }
    </style>
  </head>

  <body>
    <header class="page-header">
      <h1>Floor Tiles</h1>
      <p>Elegant • Durable • Modern Designs</p>

      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </header>

    <section class="tile-gallery" id="tileGallery"></section>

    <a href="#" id="backToTop">
      <img src="Screenshot 2026-02-26 214133.png" />
    </a>

    <script>
      async function loadTiles() {
        const response = await fetch("Premium Floor Tiles.json");
        const tiles = await response.json();

        const gallery = document.getElementById("tileGallery");

        tiles.forEach((tile) => {
          const card = document.createElement("div");
          card.className = "tile-card";

          card.innerHTML = `
<img src="${tile.image}">
<div class="tile-info">
<h3>${tile.name}</h3>
<p><b>Size:</b> ${tile.size}</p>
<p><b>Finish:</b> ${tile.finish}</p>
<p><b>Brand:</b> ${tile.brand}</p>
</div>
`;

          gallery.appendChild(card);
        });
      }

      loadTiles();
    </script>
  </body>
</html>
